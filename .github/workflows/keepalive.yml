name: keepalive

# GitHub auto-disables scheduled workflows in a public repo after 60 days
# without repository activity (I5). Publishes commit on their own; this
# workflow commits a heartbeat line only when NOTHING was committed for
# KEEPALIVE_DAYS, so build-wiki (monthly) and build-dict (quarterly) stay
# scheduled even through months when nothing is published.
#
# UNVERIFIED PREMISE (OPS3-04), so nothing below is a guarantee: GitHub
# documents only "no repository activity" for 60 days; it does not say that
# a push by GITHUB_TOKEN (github-actions[bot]) counts as activity. If it does
# not, the publish commits and the heartbeat reset nothing. So this workflow
# carries a SECOND, independent belt: every run it calls the documented,
# idempotent `PUT /repos/{repo}/actions/workflows/{file}/enable` for each of
# the three scheduled workflows that is active or disabled for inactivity —
# never one an operator disabled by hand (OPS4-01: that is how a pipeline is
# paused) — (third-party keepalive tools report that a force-enable resets
# the inactivity counter — also not documented by GitHub). Neither belt can revive keepalive once GitHub has disabled it
# itself. The human backstop: GitHub emails the repository owner a warning
# BEFORE it disables a workflow — that email means "dispatch keepalive (or
# any workflow) by hand now".
#
# INVARIANT (OPS2-04), under the premise above: no plausible run of missed
# schedules can reach day 60.
# Scheduled runs CAN be dropped (GitHub documents this under load), so the
# margin must survive several misses, not zero: with a weekly cron the gap
# between two EXECUTED runs is 7 x (missed + 1) days, and the worst idle time
# at the next executed run is KEEPALIVE_DAYS + that gap. 21 + 7 x (4 + 1) =
# 56 < 60: four consecutive dropped runs are survivable. It lives in its own
# workflow with its own concurrency group, so a pending publish run can never
# cancel it (the publish group cancels pending runs queued behind another).
# Who clears a missed heartbeat: the next weekly run (the check is stateless:
# "idle >= KEEPALIVE_DAYS" re-evaluates from git history every time).
# Cost: a public repo's standard runner is free; the run is a checkout and a
# date comparison (seconds), and commits at most once per KEEPALIVE_DAYS.

on:
  schedule:
    # Off the hour (scheduled runs are delayed at :00); every Monday.
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rowtalk-packs-keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # commits the heartbeat line
      actions: write # re-enables the scheduled workflows (second belt)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Heartbeat if idle for KEEPALIVE_DAYS
        env:
          KEEPALIVE_DAYS: "21"
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -lt "$KEEPALIVE_DAYS" ]; then echo "recent activity"; exit 0; fi
          mkdir -p editions
          echo "{\"action\": \"heartbeat\", \"at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> editions/heartbeat.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/heartbeat.jsonl
          git commit -m "chore(packs): keepalive heartbeat"
          # A publish may push to main at the same moment: bounded rebase +
          # retry; if all three fail, next week's run tries again.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Re-enable the scheduled workflows (second belt)
        # Runs whatever the heartbeat did; a failed call makes the job red
        # (the operator's signal) but tries every workflow.
        # INVARIANT (OPS4-01): the belt never overrides an operator. PUT
        # .../enable sets ANY state to active, including disabled_manually —
        # GitHub's standard way to pause a scheduled pipeline (e.g. after a
        # rollback, while investigating). So it enables only `active` (the
        # counter-reset hope) and `disabled_inactivity` (what the belt is
        # for); `disabled_manually` is left alone with a weekly ::warning::
        # (the reminder that the pipeline is paused); any other state is
        # left alone too. Who clears a manual disable: the operator, in the
        # Actions tab — nothing here ever does.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          failed=0
          for workflow in build-wiki.yml build-dict.yml keepalive.yml; do
            if ! state=$(gh api "repos/$REPO/actions/workflows/$workflow" --jq .state); then
              echo "::error::could not read the state of $workflow"; failed=1; continue
            fi
            case "$state" in
              active|disabled_inactivity)
                if gh api -X PUT "repos/$REPO/actions/workflows/$workflow/enable" --silent; then
                  echo "enabled $workflow (was $state)"
                else
                  echo "::error::could not enable $workflow"; failed=1
                fi
                ;;
              disabled_manually)
                echo "::warning::$workflow was disabled by hand and stays disabled (paused); enable it in the Actions tab to resume its schedule"
                ;;
              *)
                echo "::warning::$workflow is in state '$state'; left as is"
                ;;
            esac
          done
          exit $failed
